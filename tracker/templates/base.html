<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Spending Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    {% set endpoint = request.endpoint or '' %}
    <a class="brand" href="{{ url_for('transactions.index') }}">Spending Tracker</a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ url_for('transactions.index') }}"
         {% if endpoint in ('transactions.index', 'transactions.edit') %}aria-current="page"{% endif %}>Transactions</a>
      <a href="{{ url_for('dashboard.index') }}"
         {% if endpoint.startswith('dashboard.') %}aria-current="page"{% endif %}>Dashboard</a>
      <a href="{{ url_for('budgets.index') }}"
         {% if endpoint.startswith('budgets.') %}aria-current="page"{% endif %}>Budgets</a>
    </nav>
    <a class="button" href="{{ url_for('transactions.add') }}">+ Add transaction</a>
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="flash {{ category }}" role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
